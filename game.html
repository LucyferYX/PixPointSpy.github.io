<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="images/icon.png" rel="icon">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">

    <title>PixPointSpy Game</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top shadow-sm">
        <div class="container-fluid navbar-nav">
            <div class="d-flex ms-auto">
                <a class="nav-link" href="index.html"><i class="bi bi-x-diamond"></i> PixPointSpy</a>
            </div>
            <div class="d-flex ms-auto">
                <a class="nav-link" href="game.html"><i class="bi bi-controller"></i> Game</a>
                <div class="nav-divider mx-3"></div>
                <a class="nav-link" href="statistics.html"><i class="bi bi-bar-chart"></i> Statistics</a>
                <div class="nav-divider mx-3"></div>
                <button id="themeToggle" class="btn nav-link" style="font-size: 2rem; font-weight: bold;"><i class="bi bi-moon"></i> Theme</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid my-5" style="padding-top: 70px;">
        <div class="row justify-content-center">
            <div class="col-lg-10 d-flex justify-content-between mb-4">
                <!-- Left card -->
                <div class="card game-card flex-grow-1 shadow-lg" style="max-width: 70%;">
                    <div class="card-body text-center">
                        <h4 class="card-title mb-4 font-weight-bold">Spot the Difference</h4>
                        <div id="canvasContainer" class="canvas-container position-relative">
                            <div class="canvas-box">
                                <p>1</p>
                                <canvas id="canvasOriginal" class="border rounded"></canvas>
                            </div>
                            <div class="canvas-box">
                                <p>2</p>
                                <canvas id="canvasAltered" class="border rounded" style="cursor: crosshair;"></canvas>
                            </div>

                            <!-- Overlay -->
                            <div id="loadingOverlay" class="position-absolute w-100 h-100 d-flex justify-content-center align-items-center">
                                <div class="loading-text text-white font-weight-bold">Loading next level...</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right card -->
                <div class="card info-card flex-grow-1 shadow-lg ms-auto" style="max-width: 25%;">
                    <div class="card-body text-center d-flex flex-column">
                        <h4 class="card-title mb-4 font-weight-bold">Game Info</h4>

                        <!-- Start button -->
                        <button id="startBtn" class="btn start-btn btn-lg mb-4 mt-auto">Restart Game</button>

                        <!-- Game stats -->
                        <div class="stats-panel mt-3">
                            <div class="stat-item">
                                <span class="stat-label">Level</span>
                                <span id="levelCounter" class="stat-value">1</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-label">Pixel Grid</span>
                                <span id="pixelCount" class="stat-value">3 x 5</span>
                            </div>
                            <div class="stat-divider"></div>
                            <div class="stat-item text-success">
                                <span class="stat-label"><i class="bi bi-check2"></i> Correct</span>
                                <span id="correctCount" class="stat-value">0</span>
                            </div>
                            <div class="stat-item text-danger">
                                <span class="stat-label"><i class="bi bi-x-lg"></i> Wrong</span>
                                <span id="wrongCount" class="stat-value">0</span>
                            </div>
                        </div>

                        <!-- Hint button -->
                        <br>
                        <button id="hintBtn" class="btn start-btn btn-lg mb-4 mt-auto">Hint</button>

                        <!-- Surrender button -->
                        <button id="surrenderBtn" class="btn start-btn btn-lg mb-4 mt-auto">Surrender</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-3 shadow-sm">
        <small>Copyright © 2025 Liene Krista Neimane. CS50x Final Project</small>
    </footer>

    <script src="js/game.js"></script>
    <script src="js/global.js"></script>
</body>
</html>
