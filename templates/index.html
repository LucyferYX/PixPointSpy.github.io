<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="/static/icon.png" rel="icon">
    <link href="/static/styles.css" rel="stylesheet">
    <title>PixPointSpy</title>
</head>

<body>
    <!-- Navbar -->
    <nav>
        <h1>PixPointSpy</h1>
    </nav>

    <!-- Controls -->
    <div>
        <button id="newImageBtn">New Image</button>
    </div>
    <div>
        <label for="pixelSlider">Pixel grid:</label>
        <input type="range" id="pixelSlider" min="2" max="128" step="1" value="32">
        <span id="pixelValue">32</span>
    </div>
    </div>
        <button id="pixelateBtn">Pixelate</button>
    </div>

    <!-- Images -->
    <div>
        <h3>Original Image</h3>
        <img id="mainImage" src="" alt="Random image from Picsum">
    </div>
    <div>
        <h3>Pixelated Image</h3>
        <img id="pixelatedImage" src="" alt="Pixelated version will appear here">
    </div>

    <script src="static/javascript.js"></script>
</body>

</html>
