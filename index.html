<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="images/icon.png" rel="icon">
    <link href="css/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">

    <title>PixPointSpy Menu</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm">
        <div class="container-fluid navbar-nav">
            <div class="d-flex ms-auto">
                <a class="nav-link" href="index.html"><i class="bi bi-x-diamond"></i> PixPointSpy</a>
            </div>
            <div class="d-flex ms-auto">
                <a class="nav-link" href="game.html"><i class="bi bi-controller"></i> Game</a>
                <a class="nav-link" href="statistics.html"><i class="bi bi-bar-chart"></i> Statistics</a>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="d-flex align-items-center justify-content-center">
        <div class="container-fluid">
            <div class="row align-items-center">

                <!-- LEFT SIDE: Glass card with text -->
                <div class="col-lg-7 col-md-6 text-center text-md-start">
                    <div class="glass-card p-5 shadow-lg rounded-4">
                        <h2 class="display-4 fw-bold mb-3 text-dark">Pixel spotting game</h2>
                        <p class="mb-3 text-muted">
                            One pixel will differ between 2 images.
                        </p>
                        <p class="mb-3 text-muted">
                            Click the altered pixel on the right image.
                        </p>
                        <p class="mb-3 text-muted">
                            Advance through increasingly tricky levels.
                        </p>
                        <p class="mb-3 text-muted">
                            Try to not make any wrong guesses!
                        </p>
                        <br>
                        <a href="game.html" class="btn btn-primary px-5 py-3 rounded-pill shadow-lg font-weight-bold">
                            Play
                        </a>
                    </div>
                </div>

                <!-- RIGHT SIDE: 3D tilted image -->
                <div class="col-lg-5 col-md-6 text-center">
                    <div class="image-tilt-wrapper mx-auto">
                        <img src="images/pixels.png" alt="Pixel art preview" class="img-fluid tilt-image shadow-lg rounded-4">
                    </div>
                </div>

            </div>
        </div>
    </main>



    <!-- Footer -->
    <footer class="text-dark text-center py-3 shadow-sm">
        <small>Copyright © 2025 Liene Krista Neimane. CS50x Final Project</small>
    </footer>
</body>

</html>
