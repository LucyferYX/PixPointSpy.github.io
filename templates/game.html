<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link href="/static/icon.png" rel="icon">
    <link href="/static/styles.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css" integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2" crossorigin="anonymous">
    <title>PixPointSpy Game</title>
</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <a class="nav-link" href="{{ url_for('index') }}">PixPointSpy</a>
        <a class="nav-link" href="{{ url_for('game') }}">Game</a>
        <a class="nav-link" href="{{ url_for('statistics') }}">Statistics</a>
    </nav>

    <section class="my-5">
        <!-- Controls -->
        <div style="text-align: center; margin-top: 100px;">
            <h2>Level: <span id="levelCounter">1</span></h2>
            <button id="startBtn">Start / Restart Game</button>
        </div>

        <!-- Puzzles -->
        <div id="canvasContainer" style="position: relative; display: flex; justify-content: center; gap: 40px;">
            <div>
                <h3>Original</h3>
                <canvas id="canvasOriginal"></canvas>
            </div>
            <div>
                <h3>Find the Difference</h3>
                <canvas id="canvasAltered" style="cursor: crosshair;"></canvas>
            </div>

            <!-- Overlay -->
            <div id="loadingOverlay">
                <div class="loading-text">Loading next level...</div>
            </div>
        </div>

        <div id="loadingMessage" style="text-align:center; display:none; margin-top:20px;">
            <em>Loading next level...</em>
        </div>
    </section>

    <script src="static/game.js"></script>
</body>

</html>
